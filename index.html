<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Console</title>
    <style>
        /* Classic Matrix/Terminal Style */
        body {
            background-color: #000000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 30px;
            font-size: 1.1rem;
            line-height: 1.6;
            overflow-y: auto;
        }

        .terminal-line {
            margin-bottom: 8px;
            white-space: pre-wrap;
            display: block;
        }

        /* Subtle blinking cursor effect */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 18px;
            background-color: #00ff00;
            animation: blink 1s infinite;
            vertical-align: middle;
            margin-left: 4px;
        }

        @keyframes blink {
            0%, 49% { background-color: #00ff00; }
            50%, 100% { background-color: transparent; }
        }

        .spacer {
            height: 24px;
        }
    </style>
</head>
<body>

    <div id="terminal"></div>
    <span class="cursor"></span>

    <script>
        const consoleLines = [
            { id: "line1", text: "Starting bot...", delay: 0, append: false },
            { id: "line2", text: "Authenticating to Dino modding network...", delay: 2000, append: false },
            { targetId: "line2", text: "... Success", delay: 1000, append: true },
            { id: "line3", text: "Connecting to servers...", delay: 1200, append: false },
            { id: "line4", text: "Server found.", delay: 800, append: false },
            { id: "line5", text: "Connecting to Discord...", delay: 1000, append: false },
            { id: "line6", text: "Successfully started bot.", delay: 800, append: false },
            { text: "", delay: 500, isSpacer: true }, // Empty line break
            { text: "", delay: 100, isSpacer: true }, // Empty line break
            { id: "line7", text: "Starting Discord...", delay: 1200, append: false },
            { id: "line8", text: "Bootstrapping...", delay: 700, append: false },
            { id: "line9", text: "Loading data...", delay: 900, append: false },
            { targetId: "line9", text: "... Success", delay: 600, append: true },
            { id: "line10", text: "Redirecting...", delay: 1000, append: false }
        ];

        const terminalContainer = document.getElementById('terminal');
        let currentLineIndex = 0;

        function printNextLine() {
            if (currentLineIndex >= consoleLines.length) {
                // REPLACE THIS LINK with your actual Discord server invite link
                window.location.href = "https://discord.com"; 
                return;
            }

            const currentLine = consoleLines[currentLineIndex];

            setTimeout(() => {
                if (currentLine.isSpacer) {
                    const spacerElement = document.createElement('div');
                    spacerElement.className = 'spacer';
                    terminalContainer.appendChild(spacerElement);
                } else if (currentLine.append) {
                    // Find the existing line and add text directly to it
                    const existingLine = document.getElementById(currentLine.targetId);
                    if (existingLine) {
                        existingLine.textContent += currentLine.text;
                    }
                } else {
                    // Create a brand new line
                    const lineElement = document.createElement('span');
                    lineElement.className = 'terminal-line';
                    lineElement.id = currentLine.id;
                    lineElement.textContent = currentLine.text;
                    terminalContainer.appendChild(lineElement);
                }
                
                // Automatically scroll down as text populates
                window.scrollTo(0, document.body.scrollHeight);
                
                currentLineIndex++;
                printNextLine();
            }, currentLine.delay);
        }

        // Initialize the log execution sequence
        printNextLine();
    </script>

</body>
</html>
