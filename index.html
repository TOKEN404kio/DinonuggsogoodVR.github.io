<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Console</title>
    <style>
        /* Classic Matrix/Terminal Style */
        body {
            background-color: #000000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 30px;
            font-size: 1.1rem;
            line-height: 1.6;
            overflow-y: auto;
        }

        .terminal-line {
            margin-bottom: 8px;
            white-space: pre-wrap;
        }

        /* Subtle blinking cursor effect */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 18px;
            background-color: #00ff00;
            animation: blink 1s infinite;
            vertical-align: middle;
            margin-left: 4px;
        }

        @keyframes blink {
            0%, 49% { background-color: #00ff00; }
            50%, 100% { background-color: transparent; }
        }

        .spacer {
            height: 24px;
        }
    </style>
</head>
<body>

    <div id="terminal"></div>
    <span class="cursor"></span>

    <script>
        const consoleLines = [
            { text: "starting bot...", delay: 0 },
            { text: "authenticating to Dino modding network...", delay: 2000 },
            { text: "success", delay: 1000 },
            { text: "connecting to servers...", delay: 1200 },
            { text: "server found", delay: 800 },
            { text: "IP address generated: 192.168." + Math.floor(Math.random() * 255) + "." + Math.floor(Math.random() * 255), delay: 600 },
            { text: "connecting to Discord...", delay: 1000 },
            { text: "successfully started bot", delay: 800 },
            { text: "", delay: 500, isSpacer: true }, // Empty line break
            { text: "", delay: 100, isSpacer: true }, // Empty line break
            { text: "starting discord...", delay: 1200 },
            { text: "bootstrapping...", delay: 700 },
            { text: "loading data...", delay: 900 },
            { text: "success", delay: 600 },
            { text: "redirecting...", delay: 1000 }
        ];

        const terminalContainer = document.getElementById('terminal');
        let currentLineIndex = 0;

        function printNextLine() {
            if (currentLineIndex >= consoleLines.length) {
                // REPLACE THIS LINK with your actual Discord invite URL
                window.location.href = "https://discord.com"; 
                return;
            }

            const currentLine = consoleLines[currentLineIndex];

            setTimeout(() => {
                const lineElement = document.createElement('div');
                
                if (currentLine.isSpacer) {
                    lineElement.className = 'spacer';
                } else {
                    lineElement.className = 'terminal-line';
                    lineElement.textContent = currentLine.text;
                }

                terminalContainer.appendChild(lineElement);
                
                // Automatically scroll down as text populates
                window.scrollTo(0, document.body.scrollHeight);
                
                currentLineIndex++;
                printNextLine();
            }, currentLine.delay);
        }

        // Initialize the log execution sequence
        printNextLine();
    </script>

</body>
</html>
